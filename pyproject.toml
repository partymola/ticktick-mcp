[build-system]
requires = ["setuptools==84.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ticktick-mcp"
version = "0.3.3"
description = "MCP server for TickTick task management via the v2 API with field-preserving updates, day-of-week validation, completion tracking, and read-after-write verification."
readme = "README.md"
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
requires-python = ">=3.13"
keywords = ["ticktick", "mcp", "model-context-protocol", "tasks", "productivity", "todo"]
authors = [
    {name = "jjdelrio", email = "641373+partymola@users.noreply.github.com"},
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Office/Business :: Scheduling",
]
# Every dependency is pinned to an exact version that the suite has been run
# against. A range leaves the choice to the resolver, which is how `mcp` 2.0.0
# reached installs unannounced and broke them. Bump deliberately, never by
# widening a spec.
dependencies = [
    "mcp==2.0.0",
    "anyio==4.14.2",
    "python-dotenv==1.2.2",
    "pydantic==2.13.4",
    # A PEP 508 direct reference, not a bare name: `[tool.uv.sources]` is a uv
    # extension that pip ignores, so a bare name resolved to the unrelated
    # `ticktick-py` on PyPI for anyone installing with pip - silently, and
    # without the fixes this server depends on. Pinned to a commit for the same
    # reason every other dependency is pinned to a version.
    "ticktick-py @ git+https://github.com/partymola/ticktick-py.git@95bac06da06cd88be885078bfb8ab5d3f0610374",
    "tzlocal==5.4.4",
]

[project.scripts]
ticktick-mcp = "ticktick_mcp.cli:main"

[project.urls]
Homepage = "https://github.com/partymola/ticktick-mcp"
Repository = "https://github.com/partymola/ticktick-mcp"
"Bug Tracker" = "https://github.com/partymola/ticktick-mcp/issues"

[tool.setuptools.packages.find]
where = ["src"]

[project.optional-dependencies]
dev = [
    "pytest==9.1.1",
    "pytest-asyncio==1.4.0",
    "ruff==0.16.3",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I"]
