[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ticktick-mcp"
version = "0.1.0"
description = "MCP server for TickTick task management via the v2 API with field-preserving updates, day-of-week validation, completion tracking, and read-after-write verification."
readme = "README.md"
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
requires-python = ">=3.13"
keywords = ["ticktick", "mcp", "model-context-protocol", "tasks", "productivity", "todo"]
authors = [
    {name = "jjdelrio", email = "641373+partymola@users.noreply.github.com"},
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
    "Topic :: Office/Business :: Scheduling",
]
dependencies = [
    "mcp>=1.6.0",
    "anyio>=4.9.0",
    "python-dotenv>=1.1.0",
    "pydantic>=2.0",
    "ticktick-py",
    "tzlocal>=5.3.1",
]

[project.scripts]
ticktick-mcp = "ticktick_mcp.cli:main"

[project.urls]
Homepage = "https://github.com/partymola/ticktick-mcp"
Repository = "https://github.com/partymola/ticktick-mcp"
"Bug Tracker" = "https://github.com/partymola/ticktick-mcp/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.uv.sources]
ticktick-py = { git = "https://github.com/partymola/ticktick-py.git", rev = "main" }

[project.optional-dependencies]
dev = [
    "pytest>=8.3.5",
    "pytest-asyncio>=0.25.0",
    "ruff>=0.6",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I"]
